# ========================================================
# Amarta Boga POS - Apache 2.4 VirtualHost Configuration
# Mendukung mod_rewrite, mod_proxy_wstunnel (Reverb WebSocket)
# ========================================================

<VirtualHost *:80>
    ServerName pos.amartaboga.com
    ServerAdmin webmaster@amartaboga.com
    DocumentRoot /var/www/amarta-pos/public

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName pos.amartaboga.com
    ServerAdmin webmaster@amartaboga.com
    DocumentRoot /var/www/amarta-pos/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pos.amartaboga.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pos.amartaboga.com/privkey.pem

    # Proxy WebSocket ke Laravel Reverb (Port 8080)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/app/(.*) ws://127.0.0.1:8080/app/$1 [P,L]

    <Directory /var/www/amarta-pos/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Custom Header Security
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/amarta_pos_error.log
    CustomLog ${APACHE_LOG_DIR}/amarta_pos_access.log combined
</VirtualHost>
