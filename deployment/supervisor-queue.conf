# ========================================================
# Amarta Boga POS - Supervisor Worker Antrean (Queue Worker)
# Lokasi file di server Linux: /etc/supervisor/conf.d/amarta-queue.conf
# ========================================================

[program:amarta-pos-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/amarta-pos/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/amarta-pos/storage/logs/supervisor-queue.log
stopwaitsecs=3600
