# ========================================================
# Amarta Boga POS - Supervisor Laravel Reverb WebSocket Server
# Lokasi file di server Linux: /etc/supervisor/conf.d/amarta-reverb.conf
# ========================================================

[program:amarta-pos-reverb]
command=php /var/www/amarta-pos/artisan reverb:start --host=0.0.0.0 --port=8080 --hostname=pos.amartaboga.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/amarta-pos/storage/logs/supervisor-reverb.log
stopwaitsecs=60
