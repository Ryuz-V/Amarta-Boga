# ========================================================
# Amarta Boga POS - Nginx Production Server Block
# Mendukung PHP 8.4-FPM, HTTP/2, Gzip & WebSocket Proxy (Reverb)
# ========================================================

# Upstream PHP-FPM (sesuaikan socket atau port)
upstream php-fpm {
    server unix:/run/php/php8.4-fpm.sock;
    # Atau jika menggunakan port TCP: server 127.0.0.1:9000;
}

# Upstream Laravel Reverb WebSocket Server
upstream reverb {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.amartaboga.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.amartaboga.com;

    root /var/www/amarta-pos/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt / Custom)
    ssl_certificate /etc/letsencrypt/live/pos.amartaboga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.amartaboga.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching (Vite build assets)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # PWA Manifest & Service Worker
    location = /manifest.json {
        add_header Cache-Control "public, max-age=604800";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Standard Laravel Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # WebSocket Proxy untuk Laravel Reverb (/app/*)
    location /app/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Deny Access to Hidden / Dot files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
